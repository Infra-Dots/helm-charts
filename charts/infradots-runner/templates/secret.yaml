{{- /* Registration tokens given inline (agent/executor.registration.token). An existingSecret is used as is. */}}
{{- range $component := list "agent" "executor" }}
{{- $values := index $.Values $component }}
{{- if and $values.enabled $values.registration.token (not $values.registration.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "runner.fullname" $ }}-{{ $component }}
  labels:
    {{- include "runner.labels" $ | nindent 4 }}
    {{- include "runner.selectorLabels" (dict "root" $ "component" $component) | nindent 4 }}
type: Opaque
stringData:
  REGISTRATION_TOKEN: {{ $values.registration.token | quote }}
{{- end }}
{{- end }}
