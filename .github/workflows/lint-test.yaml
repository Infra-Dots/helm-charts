name: Lint and test charts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      # The version-bump check compares against main, so it only means something on a pull request.
      - name: Lint
        run: ct lint --config ct.yaml --all --check-version-increment=${{ github.event_name == 'pull_request' }}

      # Every example renders to valid Kubernetes objects (the schema rejects bad values first).
      - name: Validate rendered manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
          for chart in charts/*/; do
            for values in "$chart"examples/*.yaml "$chart"ci/*.yaml; do
              [ -e "$values" ] || continue
              echo "== $values"
              helm template ci "$chart" -f "$values" \
                --set agent.registration.token=ci --set executor.registration.token=ci \
                | kubeconform -strict -summary -kubernetes-version 1.30.0
            done
          done

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      # Installs each chart with every ci/*-values.yaml and waits for it to be ready.
      - name: Install
        run: ct install --config ct.yaml --all
